

services:
  app:
    build: .
    ports:
      - "5003:5001"
    environment:
      - MONITORED_SERVICES=[{"name":"GitHub API","url":"https://api.github.com"},{"name":"JSONPlaceholder","url":"https://jsonplaceholder.typicode.com/posts/1"},{"name":"HTTPBin Healthy","url":"https://httpbin.org/status/200"},{"name":"IoT Light Sensor","url":"https://iot-light-sensor.onrender.com/"}]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json
    depends_on:
      - prometheus
